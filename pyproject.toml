[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "skill-primitives"
version = "0.0.1"
description = "Natural language to robot motion. Decompose LeRobot datasets into composable skill primitives."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "Asif Kazi", email = "kazisaadasif29@gmail.com" },
]
keywords = [
    "robotics",
    "robot-learning",
    "imitation-learning",
    "lerobot",
    "skill-composition",
    "natural-language",
    "manipulation",
    "trajectory-segmentation",
    "composable-skills",
    "foundation-models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.16.0",
    "pillow>=10.0.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
lerobot = [
    "lerobot>=0.1.0",
]
llm = [
    "openai>=1.0.0",
    "groq>=0.4.0",
]
local = [
    "ollama>=0.1.0",
]
viz = [
    "matplotlib>=3.7.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.8",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
paper = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
]
all = [
    "skill-primitives[lerobot,llm,local,viz,dev,paper]",
]

[project.scripts]
sp-segment = "skill_primitives.cli.segment:main"
sp-annotate = "skill_primitives.cli.annotate:main"
sp-compose = "skill_primitives.cli.compose:main"
sp-demo = "skill_primitives.cli.demo:main"

[project.urls]
Homepage = "https://github.com/ksaad20/skill-primitives"
Documentation = "https://github.com/ksaad20/skill-primitives#readme"
Repository = "https://github.com/ksaad20/skill-primitives.git"
Issues = "https://github.com/ksaad20/skill-primitives/issues"
Changelog = "https://github.com/ksaad20/skill-primitives/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["skill_primitives"]

[tool.hatch.build.targets.sdist]
include = [
    "/skill_primitives",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.env
  | venv
  | env
  | build
  | dist
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | node_modules
)/
'''

# ── isort ────────────────────────────────────────────────────────────────────


# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["SIM102", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["skill_primitives"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

ignore_missing_imports = true
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU",
    "integration: marks integration tests",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["skill_primitives"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true
skip_covered = false

[[tool.mypy.overrides]]
module = [
    "skill_primitives.core.validator",
    "skill_primitives.io",
    "skill_primitives.io.*",
    "skill_primitives.primitives.registry",
]
ignore_errors = true
disable_error_code = ["no-untyped-def", "return-value", "func-returns-value"]

[[tool.mypy.overrides]]
module = [
    "skill_primitives.core.validator",
    "skill_primitives.io",
    "skill_primitives.io.*",
    "skill_primitives.primitives.registry",
]
ignore_errors = true
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = [
    "skill_primitives.core.validator",
    "skill_primitives.io",
    "skill_primitives.io.*",
    "skill_primitives.primitives.registry",
]
ignore_errors = true
disable_error_code = ["no-untyped-def", "return-value", "func-returns-value", "attr-defined"]
