name: transport
version: "0.0.1"
category: manipulation
author: ksaad20
files:
  - transport.py
description: Object is moved horizontally to a new location with gripper closed.

detection:
  strategy: sustained_horizontal_motion
  preconditions:
    gripper_state: closed
  parameters:
    xy_velocity_threshold: 0.005
    min_duration_frames: 3
  state_requirements:
    velocity: true
    gripper: true
  confidence: 0.85

constraints:
  temporal_order: [grasp, lift]
  gripper_must_remain: closed

natural_language:
  templates:
    - "transport the object to the destination"
    - "move {object} to {location}"
    - "carry {object} across"
