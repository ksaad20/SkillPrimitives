name: lift
description: Object is lifted vertically while secured by gripper.

detection:
  strategy: sustained_positive_z_velocity
  preconditions:
    gripper_state: closed    # gripper[t] < 0.5
  parameters:
    z_velocity_threshold: 0.005
    min_duration_frames: 3
  state_requirements:
    velocity: true
    gripper: true
  confidence: 0.90

constraints:
  # Must occur after grasp, before place/transport
  temporal_order: [grasp]
  gripper_must_remain: closed

natural_language:
  templates:
    - "lift the object vertically"
    - "lift {object} up"
    - "raise {object}"
