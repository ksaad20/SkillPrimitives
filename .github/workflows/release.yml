name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

# OIDC trusted publishing to PyPI (no long-lived API tokens)
permissions:
  contents: write          # For GitHub Release creation
  id-token: write          # For OIDC PyPI publishing

env:
  FORCE_COLOR: "1"

jobs:
  # ── 1. Verify tag matches package version ─────────────────────────────────
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract package version
        id: pkg
        run: |
          pip install tomli
          python -c "
          import tomli, sys
          with open('pyproject.toml', 'rb') as f:
              data = tomli.load(f)
          print(f'version={data[\'project\'][\'version\']}')
          " >> "$GITHUB_OUTPUT"

      - name: Assert versions match
        run: |
          if [ "${{ steps.tag.outputs.version }}" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.tag.outputs.version }}) does not match package version (${{ steps.pkg.outputs.version }})"
            exit 1
          fi
          echo "✅ Versions match: ${{ steps.tag.outputs.version }}"

  # ── 2. Build distributions ────────────────────────────────────────────────
  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ── 3. Publish to PyPI (trusted publishing via OIDC) ──────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skill-primitives
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── 4. Create GitHub Release ──────────────────────────────────────────────
  release-github:
    name: GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # Full history for changelog generation

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract changelog section for this version
          awk "/^## \[?$VERSION\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog entry found for $VERSION" > RELEASE_NOTES.md
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
