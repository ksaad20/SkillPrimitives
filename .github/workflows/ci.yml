name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ['v*']          # Releases handled by release.yml
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled'
        required: false
        default: false
        type: boolean

# Cancel redundant runs on the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions — escalate only where needed
permissions:
  contents: read

env:
  FORCE_COLOR: "1"              # Rich/colored output in logs
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. Lint & Type Check (fast feedback, single runner) ───────────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting (Black)
        run: black --check --diff .

      - name: Lint with Ruff
        run: ruff check .

      - name: Check import sorting
        run: ruff check --select I --diff .

      - name: Type check with mypy
        run: mypy skill_primitives

  # ── 2. Test Matrix (comprehensive, parallel) ──────────────────────────────
  test:
    name: Test
    needs: quality                 # Don't waste matrix time if lint fails
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false             # See all Python/OS failures, not just first
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # Windows + 3.9 is lowest priority; drop to save minutes
          - os: windows-latest
            python-version: '3.9'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --cov=skill_primitives --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false    # Don't block CI if Codecov is down

      - name: Demo smoke test
        run: python -m skill_primitives.demo

  # ── 3. Zoo Build Verification (ensure artifacts generate cleanly) ──────────
  zoo:
    name: Zoo Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build zoo artifacts
        run: python scripts/build_zoo.py

      - name: Verify manifest exists
        run: test -f zoo_manifest.json

      - name: Upload zoo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zoo-artifacts
          path: zoo/
          retention-days: 7

  # ── 4. Package Build & Distribution Check ─────────────────────────────────
  build:
    name: Build & Verify
    needs: [quality, test, zoo]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-wheel-contents

      - name: Build distributions
        run: python -m build

      - name: Check wheel contents
        run: check-wheel-contents dist/*.whl

      - name: Twine check
        run: twine check dist/*

      - name: Test install from wheel
        run: |
          pip install dist/*.whl
          python -c "import skill_primitives; print(skill_primitives.__version__)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # ── 5. Release Checklist (pre-release gate) ───────────────────────────────
  release-check:
    name: Release Gate
    needs: [quality, test, zoo, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run release checklist
        run: python scripts/release_checklist.py --strict

  # ── Debug: tmate session (manual trigger only) ────────────────────────────
  debug:
    name: Debug
    if: ${{ inputs.debug_enabled }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mxschmitt/action-tmate@v3
