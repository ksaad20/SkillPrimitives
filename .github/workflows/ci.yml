name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine
      - run: pytest tests/ -v
      - run: python -m skill_primitives.demo
      - run: python -m build
      - run: twine check dist/*
      - run: |
          pip install dist/*.whl
          python -c "import skill_primitives; print(skill_primitives.__version__)"
          python -c "from skill_primitives.core.segmenter import segment_episode"
          python -c "from skill_primitives.core.composer import compose"
          python -c "from skill_primitives.io.exporters import JSONExporter"
