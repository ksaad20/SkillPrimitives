name: Stale

on:
  schedule:
    - cron: '0 6 * * *'    # Daily at 06:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 14 days if no further activity occurs.
          close-issue-message: |
            This issue has been automatically closed due to inactivity. Feel free to reopen if it's still relevant.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug'

          # PRs
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity. It will be closed in 14 days if no further activity occurs.
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,WIP'

          # General
          operations-per-run: 30
          remove-stale-when-updated: true
