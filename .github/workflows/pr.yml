name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write    # For PR comment posting

jobs:
  # ── 1. Validate PR title follows conventional commits ─────────────────────
  title:
    name: Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$    # Must start with capital letter
          subjectPatternError: |
            PR title must start with a capital letter (e.g., "Fix bug" not "fix bug").

  # ── 2. Check for merge conflict markers ───────────────────────────────────
  conflicts:
    name: Conflict Markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for conflict markers
        run: |
          if grep -rn '<<<<<<< HEAD' --include='*.py' --include='*.js' --include='*.ts' --include='*.yaml' --include='*.yml' --include='*.md' .; then
            echo "::error::Found merge conflict markers in source files"
            exit 1
          fi
          echo "✅ No conflict markers found"

  # ── 3. Check PR size (warn on large diffs) ────────────────────────────────
  size:
    name: Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/xs'
          xs_max_size: '50'
          s_label: 'size/s'
          s_max_size: '200'
          m_label: 'size/m'
          m_max_size: '500'
          l_label: 'size/l'
          l_max_size: '1000'
          xl_label: 'size/xl'
          fail_if_xl: 'false'
          message_if_xl: |
            This PR is quite large (>{l_max_size} lines). Consider breaking it into smaller chunks.
