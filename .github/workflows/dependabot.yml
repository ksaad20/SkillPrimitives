# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - ksaad20
    assignees:
      - ksaad20
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
      include: scope
    groups:
      dev-dependencies:
        patterns:
          - pytest*
          - black
          - ruff
          - mypy
          - isort
        update-types:
          - minor
          - patch
      runtime-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - pytest*
          - black
          - ruff
          - mypy
          - isort
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - ksaad20
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
